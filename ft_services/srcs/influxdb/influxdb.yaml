apiVersion: v1
kind: Service
metadata: 
  labels: 
    app: influxdb
  name: influxdb
spec: 
  ports: 
    - port: 8086
  selector: 
    app: influxdb
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: influxdb-pvc
  labels:
    app: influxdb-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata: 
  labels: 
    app: influxdb
  name: influxdb
spec: 
  replicas: 1
  selector: 
    matchLabels: 
      app: influxdb
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template: 
    metadata: 
      labels: 
        app: influxdb
    spec: 
      containers: 
        - 
          image: my_influxdb
          name: influxdb
          imagePullPolicy: Never
          ports:
            - containerPort: 8086
          volumeMounts:
            - name: influxdb
              mountPath: /var/lib/influxdb/
      volumes:
            - name: influxdb
              persistentVolumeClaim:
                claimName: influxdb-pvc
